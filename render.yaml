services:
  - type: web
    name: valeria-api
    runtime: python-3.12
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://valeria-api.onrender.com
    routes:
      - path: /
        matchType: prefix
        serviceName: valeria-api

  - type: background_worker
    name: valeria-keep-alive
    runtime: python-3.12
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python keep_alive.py"
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: https://valeria-api.onrender.com
